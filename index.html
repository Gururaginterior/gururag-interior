<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ================================
         PRIMARY SEO
    ================================= -->

    <title>
      Gururag Interiors | Interior Designers in Chennai & Poonamallee
    </title>

    <meta
      name="description"
      content="Gururag Interiors provides premium home, office and turnkey interior design solutions in Chennai, Poonamallee and surrounding areas including Thandalam, Chembarambakkam, Kattupakkam, Kumananchavadi and Karayanchavadi."

    <meta
      name="author"
      content="Gururag Interiors"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.gururag.com/"
    />

    <link
      rel="icon"

      href="/logo.jpg"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.jpg"
    />

    <!-- ================================
         OPEN GRAPH
    ================================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Gururag Interiors | Interior Designers in Chennai & Poonamallee"

      property="og:description"
      content="Premium home, office and turnkey interior design solutions by Gururag Interiors in Chennai, Poonamallee and surrounding areas."

      content="Gururag Interiors"
    />

    <meta
      property="og:image"
      content="https://www.gururag.com/logo.jpg"
